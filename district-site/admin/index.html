<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="robots" content="noindex">
  <title>District — Manage the site</title>
</head>
<body>
  <script src="https://unpkg.com/decap-cms@^3.8.4/dist/decap-cms.js"></script>

  <script>
  (function () {
    /* Parse dollar amounts into cents; invalid or negative prices get no badge. */
    function parseMoney(v){
      if (v == null) return null;
      const text = String(v).trim().replace(/^\$\s*/, '');
      if (!/^(?:\d+|\d{1,3}(?:,\d{3})+)(?:\.\d{1,2})?$/.test(text)) return null;
      const parts = text.replace(/,/g, '').split('.');
      const cents = Number(parts[0]) * 100 + Number((parts[1] || '').padEnd(2, '0'));
      return Number.isSafeInteger(cents) && cents <= Number.MAX_SAFE_INTEGER / 100 ? cents : null;
    }

    /* Round DOWN; stored manual badges never override the current prices. */
    function pctOff(compare, price){
      const c = parseMoney(compare), p = parseMoney(price);
      if (c === null || p === null || c <= 0 || p >= c) return null;
      const pct = Math.floor((c - p) * 100 / c);
      return pct >= 1 ? pct + '% off' : null;
    }
    /* Only show dates the owner entered, validated against Orlando's current date. */
    function formatUpdated(value){
      if (typeof value !== 'string' || !/^\d{4}-\d{2}-\d{2}$/.test(value)) return '';
      const date = new Date(value + 'T12:00:00Z');
      if (!Number.isFinite(date.getTime()) || date.toISOString().slice(0,10) !== value) return '';
      const parts = Object.fromEntries(new Intl.DateTimeFormat('en-US', {
        timeZone:'America/New_York', year:'numeric', month:'2-digit', day:'2-digit'
      }).formatToParts(new Date()).map(p => [p.type,p.value]));
      const today = parts.year + '-' + parts.month + '-' + parts.day;
      if (value > today) return '';
      return new Intl.DateTimeFormat('en-US', {timeZone:'UTC',month:'short',day:'numeric',year:'numeric'}).format(date);
    }
    /* Supported Decap preview: recomputed from draft prices on every render. */
    const FindsPreview = createClass({
      render: function () {
        const values = this.props.entry.getIn(['data', 'items']);
        const items = values ? values.toJS() : [];
        const getAsset = this.props.getAsset;
        return h('section', {style: {fontFamily: 'sans-serif', padding: '24px', color: '#0B0B0C'}},
          h('h1', {}, 'Product preview'),
          h('p', {}, 'Preview photos, prices and automatic discounts as you edit. Sold-out items stay here but are hidden on the website. Publish to apply changes.'),
          items.length ? items.map(function (item, index) {
            const badge = pctOff(item.compare, item.price);
            let photo = '';
            if (item.photo && typeof getAsset === 'function'){
              const asset = getAsset(item.photo);
              const url = asset ? asset.toString() : '';
              if (/^(?:https?:\/\/|blob:|data:image\/(?:png|jpeg|gif|webp);|\/images\/uploads\/)/i.test(url)) photo = url;
            }
            return h('article', {key: index, style: {borderBottom: '1px solid #E2E2E6', padding: '16px 0'}},
              photo ? h('img', {src:photo, alt:item.name || 'Product photo', style:{width:'100%', maxWidth:'240px', aspectRatio:'4 / 5', objectFit:'cover', borderRadius:'4px'}})
                : h('p', {}, 'No photo selected'),
              h('p', {style:{fontWeight:'bold'}}, item.sold_out === true ? 'Sold out — hidden on website' : 'Visible on website'),
              h('p', {}, item.category || 'Choose a department'),
              h('h2', {style: {fontSize: '18px', margin: '0 0 8px'}}, item.name || 'New item'),
              h('p', {}, 'Compare at price: ' + (item.compare || '—') + ' · Our price: ' + (item.price == null || item.price === '' ? '—' : item.price)),
              item.sizes ? h('p', {}, 'Sizes: ' + item.sizes) : null,
              item.colors ? h('p', {}, 'Colors: ' + item.colors) : null,
              formatUpdated(item.last_updated) ? h('p', {}, 'Updated ' + formatUpdated(item.last_updated)) :
                (item.last_updated ? h('p', {style:{color:'#B3261E'}}, 'Update date is invalid or in the future; it will not appear on the website.') : null),
              h('p', {style: {color: '#C2226F', fontWeight: 'bold'}, 'aria-live': 'polite'},
                badge || 'No discount badge: enter a valid original price and a lower sale price. Discounts below 1% are hidden.')
            );
          }) : h('p', {}, 'Add an item and enter its two prices to see the discount.')
        );
      }
    });
    CMS.registerPreviewTemplate('finds', FindsPreview);
  })();
  </script>
</body>
</html>
