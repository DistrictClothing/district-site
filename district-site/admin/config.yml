# ============================================================
#  DISTRICT CLOTHING AND MORE — admin panel config
#  Ready to use. No edits needed.
# ============================================================

backend:
  name: git-gateway
  repo: DistrictClothing/district-site
  branch: main
  identity_url: https://auth.decapbridge.com/sites/8390ad14-8ecd-436c-942f-d38b01c4546c
  gateway_url: https://gateway.decapbridge.com
  commit_messages:
    create: 'Add {{collection}} "{{slug}}" - {{author-name}} via DecapBridge'
    update: 'Update {{collection}} "{{slug}}" - {{author-name}} via DecapBridge'
    delete: 'Delete {{collection}} "{{slug}}" - {{author-name}} via DecapBridge'
    uploadMedia: 'Upload "{{path}}" - {{author-name}} via DecapBridge'
    deleteMedia: 'Delete "{{path}}" - {{author-name}} via DecapBridge'
    openAuthoring: 'Message {{message}} - {{author-name}} via DecapBridge'

logo_url: https://decapbridge.com/decapcms-with-bridge.svg
site_url: https://district-clothing.com

# Where uploaded photos are saved
media_folder: "district-site/images/uploads"
public_folder: "/images/uploads"

collections:

  # ---------- THIS WEEK'S FINDS ----------
  - name: "finds"
    label: "This Week's Finds"
    editor:
      preview: true
    files:
      - name: "finds"
        label: "Finds on the floor"
        file: "district-site/content/finds.json"
        description: "Add, edit, reorder or delete the items shown on the website. Drag to reorder."
        fields:
          - label: "Items"
            name: "items"
            widget: "list"
            label_singular: "Item"
            summary: "{{fields.name}} — {{fields.price}}"
            fields:
              - label: "Photo"
                name: "photo"
                widget: "image"
                required: false
                hint: "Hold your phone upright when you shoot. Leave blank to show a placeholder."
              - label: Department
                name: category
                widget: select
                options:
                - Women
                - Men
                - Kids & baby
                - Shoes
                - Home
                - Beauty
                - Bags
                - Toys & gifts
                - Women’s Activewear
                - Men’s Graphic Tees
                - Girls’ Clothing
                - Women’s Handbags & Accessories
                - Men's tops
                - Men's Hoodies
                hint: Choose a consistent department. Existing department labels are preserved as choices.
              - label: "Item name"
                name: "name"
                widget: "string"
                hint: "e.g. Cotton midi dress"
              - label: "Compare at price"
                name: "compare"
                widget: "string"
                required: false
                hint: "Original price, e.g. $39.99. The discount updates automatically in Preview when either price changes. Leave blank for no badge."
              - label: "Our price"
                name: "price"
                widget: "string"
                hint: "Sale price, e.g. $19.99. Open Preview to see the automatically calculated percent off."
              - label: Sizes (optional)
                name: sizes
                widget: string
                required: false
                hint: Enter actual available sizes, e.g. S, M, L. Leave blank if unknown.
              - label: Colors (optional)
                name: colors
                widget: string
                required: false
                hint: Enter actual available colors. Leave blank if unknown.
              - label: Last updated (optional)
                name: last_updated
                widget: string
                required: false
                hint: 'Only enter the actual date you checked or updated this item: YYYY-MM-DD. No date is added automatically;
                  future or invalid dates are hidden.'
                pattern:
                - ^\d{4}-\d{2}-\d{2}$
                - Use YYYY-MM-DD or leave blank.
              - label: "Sold out / hide from website"
                name: "sold_out"
                widget: "boolean"
                default: false
                required: false
                hint: "Turn on to hide this item without deleting it. Turn off to show it again."
              # Preserve legacy data; discounts are calculated from the two prices.
              - name: "off"
                widget: "hidden"
                required: false

  # ---------- SITE SETTINGS ----------
  - name: "settings"
    label: "Site Settings"
    files:
      - name: "settings"
        label: "Hours, homepage, announcements & contact"
        file: "district-site/content/settings.json"
        description: "Edit daily schedules, choose when to switch to permanent hours, and update homepage copy and links. Publish to apply changes."
        fields:
          - label: "Show the diagonal ribbon"
            name: "ribbon_on"
            widget: "boolean"
            default: true
            hint: "Turn this OFF the day you open."
          - label: "Ribbon text"
            name: "ribbon_text"
            widget: "string"
            default: "Opening Fall 2026"
          - label: "Banner line under the logo"
            name: "eyebrow"
            widget: "string"
            default: "New arrivals every week"
          - label: "Whatnot profile link"
            name: "whatnot_url"
            widget: "string"
            required: false
            hint: "Full link, e.g. https://www.whatnot.com/user/yourhandle"
          - label: "Contact email"
            name: "email"
            widget: "string"
            required: false
          - label: "Phone number"
            name: "phone"
            widget: "string"
            required: false
            hint: "Leave blank to hide it from the site."
          - label: Active opening schedule
            name: opening_mode
            widget: select
            default: soft
            options:
            - label: Soft opening (active now)
              value: soft
            - label: Permanent hours
              value: permanent
            hint: Switch manually only when permanent hours should start. No date-based switch is scheduled.
          - label: 'Soft opening: daily hours'
            name: soft_hours
            widget: list
            allow_add: false
            min: 7
            max: 7
            summary: '{{fields.day}} — {{fields.open}} to {{fields.close}}'
            hint: Use each day once. Closed days ignore the time fields. Opening and closing must be on the same day.
            fields:
            - label: Day
              name: day
              widget: hidden
            - label: Closed all day
              name: closed
              widget: boolean
              default: false
            - label: Opens
              name: open
              widget: string
              required: false
              hint: e.g. 12:00 PM or 09:00
              pattern:
              - ^(?:(?:0?[1-9]|1[0-2])(?::[0-5][0-9])?\s*[AaPp][Mm]|(?:[01]?[0-9]|2[0-3])(?::[0-5][0-9])?)$
              - Enter a valid time such as 12:00 PM or 23:00.
            - label: Closes
              name: close
              widget: string
              required: false
              hint: e.g. 8:00 PM or 23:00
              pattern:
              - ^(?:(?:0?[1-9]|1[0-2])(?::[0-5][0-9])?\s*[AaPp][Mm]|(?:[01]?[0-9]|2[0-3])(?::[0-5][0-9])?)$
              - Enter a valid time such as 12:00 PM or 23:00.
          - label: 'Permanent: daily hours'
            name: permanent_hours
            widget: list
            allow_add: false
            min: 7
            max: 7
            summary: '{{fields.day}} — {{fields.open}} to {{fields.close}}'
            hint: Use each day once. Closed days ignore the time fields. Opening and closing must be on the same day.
            fields:
            - label: Day
              name: day
              widget: hidden
            - label: Closed all day
              name: closed
              widget: boolean
              default: false
            - label: Opens
              name: open
              widget: string
              required: false
              hint: e.g. 12:00 PM or 09:00
              pattern:
              - ^(?:(?:0?[1-9]|1[0-2])(?::[0-5][0-9])?\s*[AaPp][Mm]|(?:[01]?[0-9]|2[0-3])(?::[0-5][0-9])?)$
              - Enter a valid time such as 12:00 PM or 23:00.
            - label: Closes
              name: close
              widget: string
              required: false
              hint: e.g. 8:00 PM or 23:00
              pattern:
              - ^(?:(?:0?[1-9]|1[0-2])(?::[0-5][0-9])?\s*[AaPp][Mm]|(?:[01]?[0-9]|2[0-3])(?::[0-5][0-9])?)$
              - Enter a valid time such as 12:00 PM or 23:00.
          - label: Homepage headline
            name: hero_headline
            widget: string
            required: false
          - label: Headline text to highlight pink
            name: hero_emphasis
            widget: string
            required: false
          - label: Homepage description
            name: hero_sub
            widget: text
            required: false
          - label: Homepage announcement (blank hides it)
            name: announcement
            widget: text
            required: false
          - label: Address line 1
            name: address_line1
            widget: string
            required: false
          - label: Address line 2
            name: address_line2
            widget: string
            required: false
          - label: Store / returns note
            name: store_note
            widget: text
            required: false
          - label: Holiday hours note
            name: holiday_note
            widget: string
            required: false
          - label: Instagram link
            name: instagram_url
            widget: string
            required: false
            hint: Full https:// link. Leave blank to hide.
          - label: Facebook link
            name: facebook_url
            widget: string
            required: false
            hint: Full https:// link. Leave blank to hide.
          - label: TikTok link
            name: tiktok_url
            widget: string
            required: false
            hint: Full https:// link. Leave blank to hide.
          - label: FAQs / store policies (optional)
            name: faqs
            widget: list
            required: false
            hint: Add only confirmed answers or policies. This section stays hidden until complete entries are added.
            fields:
            - label: Question
              name: question
              widget: string
            - label: Answer
              name: answer
              widget: text
